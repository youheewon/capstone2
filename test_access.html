<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Naver Map Simple Test</title>
  <style>
    #map {
      width: 100%;
      height: 400px;
    }
  </style>
</head>
<body>
  <h1>Simple Map Test</h1>
  <div id="map"></div>

  <!-- 네이버 지도 JS (너 키 사용) -->                                
  <script src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=rswlfafz91"></script>
  <script>
    var map = new naver.maps.Map('map', {
      center: new naver.maps.LatLng(37.5666102, 126.9783881), // 서울 시청 근처
      zoom: 15
    });
  </script>
</body>
</html>
