<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />

    <title>Delivery Route Viewer (Google Maps)</title>

    <style>
        html, body { height: 100%; margin: 0; padding: 0; }
        #map { height: 100%; width: 100%; }

        #info-panel {
            position: fixed;
            top: 15px; left: 15px;
            width: 260px;
            background: rgba(255,255,255,0.95);
            padding: 12px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.3);
            z-index: 99;
            font-family: Arial, sans-serif;
            font-size: 13px;
        }

        #info-panel .label {
            font-weight: bold;
        }
    </style>

    <!-- GOOGLE MAPS LOADER  -->
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCnezJhQUWpHH9a9vnVjV-0Oze0pyUjOR8&callback=initMap&libraries=geometry"
            async defer></script>
</head>

<body>

<div id="map"></div>

<!-- 좌측 상단 패널 -->
<div id="info-panel">
    <div><span class="label">Plant Addr:</span> <span id="plant"></span></div>
    <div><span class="label">Ship Addr:</span> <span id="ship"></span></div>
    <div><span class="label">Outbound Delv.:</span> <span id="vbeln"></span></div>
    <div><span class="label">Item No.:</span> <span id="posnr"></span></div>
</div>

<script>
    function getParam(name) {
        return new URLSearchParams(window.location.search).get(name);
    }

    // 전달받은 파라미터
    const plantAddr = getParam("plantAddr");
    const shipAddr  = getParam("shipAddr");
    const vbeln     = getParam("vbeln");
    const posnr     = getParam("posnr");

    // 좌측 패널 정보 반영
    document.getElementById("plant").textContent = plantAddr;
    document.getElementById("ship").textContent  = shipAddr;
    document.getElementById("vbeln").textContent = vbeln;
    document.getElementById("posnr").textContent = posnr;

    let map, geocoder, directionsService, directionsRenderer;

    async function initMap() {
        map = new google.maps.Map(document.getElementById("map"), {
            center: { lat: 37.5, lng: 127.0 },
            zoom: 10,
        });

        geocoder = new google.maps.Geocoder();
        directionsService = new google.maps.DirectionsService();
        directionsRenderer = new google.maps.DirectionsRenderer({
            map: map,
            suppressMarkers: true  // 마커는 우리가 따로 그린다
        });

        // 공장 / 고객 지오코딩
        const startPos = await geocodeAddress(plantAddr);
        const endPos   = await geocodeAddress(shipAddr);

        if (!startPos || !endPos) {
            alert("지오코딩 실패! 주소를 다시 확인하세요.");
            return;
        }

        // 공장 마커
        new google.maps.Marker({
            map: map,
            position: startPos,
            label: "P",
            title: plantAddr
        });

        // 고객 마커
        new google.maps.Marker({
            map: map,
            position: endPos,
            label: "C",
            title: shipAddr
        });

        // 네비게이션 경로 표시
        drawRoute(startPos, endPos);

        // InfoWindow (마커 클릭 시 주소 표시)
        const infoWindow = new google.maps.InfoWindow();

        map.addListener("click", () => infoWindow.close());
    }

    function geocodeAddress(addr) {
        return new Promise((resolve) => {
            geocoder.geocode({ address: addr }, (results, status) => {
                if (status === "OK") {
                    resolve(results[0].geometry.location);
                } else {
                    console.warn("Geocode failed:", addr, status);
                    resolve(null);
                }
            });
        });
    }

    function drawRoute(start, end) {
        directionsService.route(
            {
                origin: start,
                destination: end,
                travelMode: google.maps.TravelMode.DRIVING
            },
            (result, status) => {
                if (status === "OK") {
                    directionsRenderer.setDirections(result);

                } else {
                    alert("Directions API 오류: " + status);
                }
            }
        );
    }
</script>

</body>
</html>
