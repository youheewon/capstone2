<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Delivery Route Viewer</title>

    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        #map {
            width: 100%;
            height: 100%;
        }
        #info-panel {
            position: fixed;
            top: 15px;
            left: 15px;
            width: 280px;
            background: rgba(255, 255, 255, 0.95);
            padding: 12px 14px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.25);
            font-family: Arial, sans-serif;
            font-size: 12px;
            z-index: 100;
            box-sizing: border-box;
        }
        #info-panel .label {
            font-weight: bold;
            display: inline-block;
            width: 80px;
        }
        #info-panel .value {
            word-wrap: break-word;
        }
        #info-panel .row {
            margin-bottom: 4px;
        }
    </style>
    
    <script src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=rswlfafz91&submodules=geocoder&callback=initMap"></script>
</head>
<body>

<div id="map"></div>

<!-- 좌측 상단 정보 패널 -->
<div id="info-panel">
    <div class="row">
        <span class="label">Plant:</span>
        <span class="value" id="plantAddr"></span>
    </div>
    <div class="row">
        <span class="label">Customer:</span>
        <span class="value" id="shipAddr"></span>
    </div>
    <div class="row">
        <span class="label">VBELN:</span>
        <span class="value" id="vbeln"></span>
    </div>
    <div class="row">
        <span class="label">POSNR:</span>
        <span class="value" id="posnr"></span>
    </div>
</div>

<script>
    // URL 파라미터 읽기
    function getParam(name) {
        return new URLSearchParams(window.location.search).get(name);
    }

    // 파라미터 값 가져오기
    const plantAddr = getParam("plantAddr") || "";
    const shipAddr  = getParam("shipAddr")  || "";
    const vbeln     = getParam("vbeln")     || "";
    const posnr     = getParam("posnr")     || "";
    // const routeStr  = getParam("route")     || "";
    let routeStr = "";
    let hash = window.location.hash; // "#route=BASE64" 형태

    if (hash.startsWith("#route=")) {
        const base64 = hash.substring(7);
        try{
            routeStr = atob(base64); // BASE64 에서 기본 문자로 복구하기
        } catch (e) {
            console.error("Base64 decode Error: ", e);
            routeStr = "";
        }
    }

    // 좌측 상단 패널에 값 표시
    document.getElementById("plantAddr").textContent = plantAddr;
    document.getElementById("shipAddr").textContent  = shipAddr;
    document.getElementById("vbeln").textContent     = vbeln;
    document.getElementById("posnr").textContent     = posnr;

    // route 문자열 → LatLng 배열로 변환
    function parseRoute(routeStr) {
        if (!routeStr) return [];

        const segments = routeStr.split(";");
        const path = [];

        for (let seg of segments) {
            if (!seg) continue;
            const parts = seg.split(",");
            if (parts.length !== 2) continue;

            const lng = parseFloat(parts[0]);
            const lat = parseFloat(parts[1]);

            if (isNaN(lat) || isNaN(lng)) continue;

            // LatLng 생성자는 (lat, lng) 순서!
            path.push(new naver.maps.LatLng(lat, lng));
        }
        return path;
    }

    const linePath = parseRoute(routeStr);

    // 지도 초기화
    let map;

    function initMap() {
        // 경로가 없으면 기본 좌표(서울 시청 근처)로
        let center = new naver.maps.LatLng(37.5666102, 126.9783881);

        if (linePath.length > 0) {
            center = linePath[Math.floor(linePath.length / 2)];
        }

        map = new naver.maps.Map('map', {
            center: center,
            zoom: 10,
            mapTypeControl: true
        });

        // 경로가 있다면 Polyline 그리기
        if (linePath.length > 0) {
            const polyline = new naver.maps.Polyline({
                map: map,
                path: linePath,
                strokeColor: '#ff0000',
                strokeWeight: 4,
                strokeOpacity: 0.9
            });

            // 시작점 / 끝점 마커
            const startLatLng = linePath[0];
            const endLatLng   = linePath[linePath.length - 1];

            const startMarker = new naver.maps.Marker({
                map: map,
                position: startLatLng
            });

            const endMarker = new naver.maps.Marker({
                map: map,
                position: endLatLng
            });

            // InfoWindow: 공장 / 고객 주소
            const startInfo = new naver.maps.InfoWindow({
                content: '<div style="font-size:12px;padding:5px 8px;">'
                       + '<b>Plant</b><br>' + (plantAddr || 'N/A') + '</div>'
            });

            const endInfo = new naver.maps.InfoWindow({
                content: '<div style="font-size:12px;padding:5px 8px;">'
                       + '<b>Customer</b><br>' + (shipAddr || 'N/A') + '</div>'
            });

            startInfo.open(map, startMarker);
            endInfo.open(map, endMarker);

            // 전체 경로가 한 화면에 나오도록 bounds 조정
            const bounds = new naver.maps.LatLngBounds();
            linePath.forEach(function (latlng) {
                bounds.extend(latlng);
            });
            map.fitBounds(bounds);
        }
    }

    // 지도 스크립트 로드 후 initMap 실행
    if (document.readyState === 'complete') {
        initMap();
    } else {
        window.addEventListener('load', initMap);
    }
</script>

</body>
</html>
