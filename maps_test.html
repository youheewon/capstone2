<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Delivery Route Viewer</title>

    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        #map {
            width: 100%;
            height: 100%;
        }
        #info-panel {
            position: fixed;
            top: 15px;
            left: 15px;
            width: 280px;
            background: rgba(255, 255, 255, 0.95);
            padding: 12px 14px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.25);
            font-family: Arial, sans-serif;
            font-size: 12px;
            z-index: 100;
            box-sizing: border-box;
        }
        #info-panel .label {
            font-weight: bold;
            display: inline-block;
            width: 80px;
        }
        #info-panel .value {
            word-wrap: break-word;
        }
        #info-panel .row {
            margin-bottom: 4px;
        }
    </style>

    <!-- 🔥 maps.js 로드 전에 hash 제거 (validatev3 URI 문제 방지) -->
    <script>
        if (location.hash) {
            history.replaceState(null, "", location.pathname + location.search);
        }
    </script>

    <!-- 네이버 지도 JS -->
    <script src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=rswlfafz91&submodules=geocoder"></script>

</head>
<body>

<div id="map"></div>

<!-- 좌측 상단 정보 패널 -->
<div id="info-panel">
    <div class="row">
        <span class="label">Plant:</span>
        <span class="value" id="plantAddr"></span>
    </div>
    <div class="row">
        <span class="label">Customer:</span>
        <span class="value" id="shipAddr"></span>
    </div>
    <div class="row">
        <span class="label">VBELN:</span>
        <span class="value" id="vbeln"></span>
    </div>
    <div class="row">
        <span class="label">POSNR:</span>
        <span class="value" id="posnr"></span>
    </div>
</div>

<script>
    // 1) ? 뒤 쿼리스트링 param 읽기
    function getQueryParam(name) {
      const params = new URLSearchParams(window.location.search);
      return params.get(name);
    }

    // 2) # 뒤 hash에서 param 읽기 (route)
    function getHashParam(name) {
      const hash = window.location.hash; // 예: "#route=AAAA&x=1"
      if (!hash || hash.length < 2) return null;
      const hashString = hash.substring(1);    // "route=AAAA&x=1"
      const params = new URLSearchParams(hashString);
      return params.get(name);
    }

    // 3) "127.1,37.1;127.2,37.2;..." → LatLng 배열로 변환
    function parseRoute(routeStr) {
      if (!routeStr) return [];

      const clean = routeStr
        .replace(/\s+/g, "")     // 공백/개행 제거
        .replace(/;;+/g, ";")    // ;; → ;
        .replace(/;$/, "");      // 끝 ; 제거

      const segments = clean.split(";");
      const path = [];

      for (let seg of segments) {
        if (!seg) continue;
        const parts = seg.split(",");
        if (parts.length !== 2) continue;

        const lng = parseFloat(parts[0]);
        const lat = parseFloat(parts[1]);

        if (!isNaN(lat) && !isNaN(lng)) {
          path.push(new naver.maps.LatLng(lat, lng));
        }
      }

      return path;
    }

    function initMap() {
      const plantAddr = getQueryParam("plantAddr");
      const shipAddr  = getQueryParam("shipAddr");
      const vbeln     = getQueryParam("vbeln");
      const posnr     = getQueryParam("posnr");

      // hash에서 BASE64 route 읽기
      const routeBase64 = getHashParam("route");
      console.log("routeBase64 from hash:", routeBase64);

      let routeStr = null;
      if (routeBase64) {
        try {
          routeStr = atob(routeBase64);
          console.log("decoded routeStr:", routeStr);
        } catch (e) {
          console.error("atob failed:", e);
        }
      }

      // 기본 지도
      const map = new naver.maps.Map("map", {
        center: new naver.maps.LatLng(37.5665, 126.9780), // 서울 중심
        zoom: 10
      });

      // route가 있고, 파싱이 성공하면 경로 & 마커 출력
      const linePath = parseRoute(routeStr);
      console.log("linePath:", linePath);

      if (linePath.length > 0) {
        // Polyline
        const polyline = new naver.maps.Polyline({
          map: map,
          path: linePath,
          strokeWeight: 4,
          strokeOpacity: 0.9
        });

        // 시작점 / 끝점 마커
        const start = linePath[0];
        const end   = linePath[linePath.length - 1];

        new naver.maps.Marker({
          map: map,
          position: start,
          title: plantAddr || "출발지"
        });

        new naver.maps.Marker({
          map: map,
          position: end,
          title: shipAddr || "도착지"
        });

        // bounds 맞춰서 줌 조정
        const bounds = new naver.maps.LatLngBounds();
        linePath.forEach(p => bounds.extend(p));
        map.fitBounds(bounds);
      } else {
        console.warn("linePath is empty. Check route base64 and parsing.");
      }
    }

    // 지도 로드 후 initMap 실행
    naver.maps.onJSContentLoaded = initMap;
  </script>
</body>
</html>
