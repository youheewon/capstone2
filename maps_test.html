<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Naver Map Route Viewer</title>

  <!-- 네이버 지도 JS (KeyId 버전 + geocoder 서브모듈) -->
  <script src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=rswlfafz91&submodules=geocoder"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: Arial, "맑은 고딕", sans-serif;
    }

    .container {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .info-panel {
      padding: 8px 12px;
      border-bottom: 1px solid #ddd;
      background-color: #f8f8f8;
      font-size: 13px;
      line-height: 1.4;
    }

    .info-row {
      margin-bottom: 2px;
    }

    .info-label {
      font-weight: bold;
      margin-right: 4px;
    }

    #map {
      flex: 1;
      min-height: 400px;
    }
  </style>
</head>
<body>
<div class="container">
  <div class="info-panel">
    <div class="info-row">
      <span class="info-label">플랜트 주소:</span>
      <span id="plantAddrText">-</span>
    </div>
    <div class="info-row">
      <span class="info-label">배송지 주소:</span>
      <span id="shipAddrText">-</span>
    </div>
    <div class="info-row">
      <span class="info-label">VBELN / POSNR:</span>
      <span id="vbelnText">-</span>
    </div>
  </div>
  <div id="map"></div>
</div>

<script>
  /**
   * 해시(#) 영역에서 route 파라미터 가져오기
   * 예: ...maps_test.html?plantAddr=...&shipAddr=...#route=BASE64값
   */
  function getRouteBase64FromHash() {
    if (!window.location.hash) return null;

    // '#route=xxx&...' -> 'route=xxx&...'
    const hashWithoutSharp = window.location.hash.substring(1);
    const hashParams = new URLSearchParams(hashWithoutSharp);
    const routeBase64Encoded = hashParams.get("route");

    if (!routeBase64Encoded) return null;

    // URL 인코딩된 Base64(%2B, %2F, %3D 등) 복원
    return decodeURIComponent(routeBase64Encoded);
  }

  /**
   * 쿼리스트링에서 plantAddr, shipAddr, vbeln, posnr 읽기
   */
  function getQueryParams() {
    const params = new URLSearchParams(window.location.search);

    return {
      plantAddr: params.get("plantAddr") || "",
      shipAddr: params.get("shipAddr") || "",
      vbeln: params.get("vbeln") || "",
      posnr: params.get("posnr") || ""
    };
  }

  /**
   * Base64 문자열 -> 원본 route 문자열 (lon,lat;lon,lat;...)
   */
  function decodeRouteString(base64Str) {
    try {
      // atob: Base64 -> 일반 문자열
      return atob(base64Str);
    } catch (e) {
      console.error("Base64 디코딩 오류:", e);
      return "";
    }
  }

  /**
   * "127.25,37.01;127.25,37.01;..." -> naver.maps.LatLng[] 경로 배열
   * (lon,lat 순서이므로 LatLng(lat, lon) 으로 생성)
   */
  function parseRouteToLatLngArray(routeStr) {
    if (!routeStr) return [];

    const points = routeStr.split(";").filter(Boolean);
    const path = [];

    for (const p of points) {
      const parts = p.split(",");
      if (parts.length !== 2) continue;

      const lon = parseFloat(parts[0]);
      const lat = parseFloat(parts[1]);

      if (isNaN(lat) || isNaN(lon)) continue;

      path.push(new naver.maps.LatLng(lat, lon));
    }

    return path;
  }

  /**
   * 주소 텍스트 패널 세팅
   */
  function setInfoPanel(plantAddr, shipAddr, vbeln, posnr) {
    document.getElementById("plantAddrText").textContent = plantAddr || "-";
    document.getElementById("shipAddrText").textContent = shipAddr || "-";

    let vbelnPosText = "-";
    if (vbeln) {
      vbelnPosText = vbeln;
      if (posnr) vbelnPosText += " / " + posnr;
    } else if (posnr) {
      vbelnPosText = posnr;
    }
    document.getElementById("vbelnText").textContent = vbelnPosText;
  }

  /**
   * 주소 하나를 지오코딩해서 콜백으로 전달 (fallback용)
   */
  function geocodeSingleAddress(addr, callback) {
    if (!addr) {
      callback(null);
      return;
    }

    naver.maps.Service.geocode({ query: addr }, function(status, response) {
      if (status !== naver.maps.Service.Status.OK || !response.addresses || response.addresses.length === 0) {
        console.warn("지오코딩 실패:", status, response);
        callback(null);
        return;
      }

      const item = response.addresses[0];
      const lat = parseFloat(item.y);
      const lon = parseFloat(item.x);

      if (isNaN(lat) || isNaN(lon)) {
        callback(null);
        return;
      }

      callback(new naver.maps.LatLng(lat, lon));
    });
  }

  /**
   * 메인 초기화
   */
  function initMap() {
    const { plantAddr, shipAddr, vbeln, posnr } = getQueryParams();
    setInfoPanel(plantAddr, shipAddr, vbeln, posnr);

    // 1) hash 영역에서 Base64 route 읽기
    const routeBase64 = getRouteBase64FromHash();
    let path = [];

    if (routeBase64) {
      const routeStr = decodeRouteString(routeBase64);
      path = parseRouteToLatLngArray(routeStr);
    }

    // 2) 기본 지도 옵션
    let mapCenter = new naver.maps.LatLng(37.5665, 126.9780); // 서울 시청 근처 (fallback)
    let mapZoom = 12;

    if (path.length > 0) {
      // 경로가 있으면 첫 점을 중심으로
      mapCenter = path[0];
      mapZoom = 13;
    }

    const map = new naver.maps.Map('map', {
      center: mapCenter,
      zoom: mapZoom
    });

    // 3) 경로가 있으면 Polyline + 시작/끝 마커
    if (path.length > 0) {
      // Polyline
      const polyline = new naver.maps.Polyline({
        map: map,
        path: path,
        strokeWeight: 4,
        strokeOpacity: 0.9,
        strokeColor: '#1f8a70' // 경로 색 (원하면 변경 가능)
      });

      // 시작/끝 마커
      const startLatLng = path[0];
      const endLatLng = path[path.length - 1];

      new naver.maps.Marker({
        map: map,
        position: startLatLng,
        title: '출발지 (Plant)'
      });

      new naver.maps.Marker({
        map: map,
        position: endLatLng,
        title: '도착지 (Ship-to)'
      });

      // 경로 전체가 보이도록 bounds 맞추기
      const bounds = new naver.maps.LatLngBounds();
      path.forEach(function (latlng) { bounds.extend(latlng); });
      map.fitBounds(bounds);

    } else {
      // 4) route가 없는 경우: shipAddr 또는 plantAddr 지오코딩해서 센터
      if (shipAddr) {
        geocodeSingleAddress(shipAddr, function(latlng) {
          if (!latlng) return;
          map.setCenter(latlng);
          map.setZoom(14);

          new naver.maps.Marker({
            map: map,
            position: latlng,
            title: '배송지 (Ship-to)'
          });
        });
      } else if (plantAddr) {
        geocodeSingleAddress(plantAddr, function(latlng) {
          if (!latlng) return;
          map.setCenter(latlng);
          map.setZoom(14);

          new naver.maps.Marker({
            map: map,
            position: latlng,
            title: '플랜트 (Plant)'
          });
        });
      }
    }
  }

  // 네이버 스크립트 로드 후 실행
  if (document.readyState === "complete" || document.readyState === "interactive") {
    naver.maps.onJSContentLoaded = initMap;
  } else {
    document.addEventListener("DOMContentLoaded", function () {
      naver.maps.onJSContentLoaded = initMap;
    });
  }
</script>
</body>
</html>
