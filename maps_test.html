<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Naver Direction5 – 배송 경로 조회</title>

  <!-- 네이버 지도 v3 (지오코더 + Direction5) -->
  <script src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=rswlfafz91&submodules=geocoder,direction5"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: "Segoe UI", "맑은 고딕", sans-serif;
    }
    body {
      margin: 0;
      padding: 0;
      display: flex;
      height: 100vh;
      background-color: #f3f4f6;
    }

    /* 왼쪽 : 지도 */
    #map {
      flex: 2;
      min-width: 60%;
      height: 100%;
    }

    /* 오른쪽 : 정보 / 상태창 */
    #side-panel {
      flex: 1;
      min-width: 320px;
      max-width: 480px;
      padding: 16px;
      background-color: #ffffff;
      border-left: 1px solid #e5e7eb;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    h1 {
      margin: 0 0 4px 0;
      font-size: 18px;
    }
    .section-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 4px;
      color: #374151;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      margin-bottom: 6px;
    }
    .field-group label {
      font-size: 12px;
      color: #4b5563;
      margin-bottom: 2px;
    }
    .field-group input {
      font-size: 13px;
      padding: 4px 6px;
      border-radius: 4px;
      border: 1px solid #d1d5db;
      background-color: #f9fafb;
    }

    #summary {
      font-size: 13px;
      padding: 8px;
      background-color: #f3f4ff;
      border-radius: 6px;
      border: 1px solid #e5e7ff;
      white-space: pre-line;
      min-height: 48px;
    }

    #status-box {
      width: 100%;
      flex: 1;
      font-size: 12px;
      font-family: Consolas, "Courier New", monospace;
      padding: 6px;
      border-radius: 6px;
      border: 1px solid #d1d5db;
      background-color: #111827;
      color: #e5e7eb;
      resize: none;
      white-space: pre;
      overflow-y: auto;
    }

    #btn-container {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }
    button {
      flex: 1;
      padding: 8px 10px;
      font-size: 13px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
    }
    #btn-load {
      background-color: #2563eb;
      color: #ffffff;
    }
    #btn-reload {
      background-color: #6b7280;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <!-- 지도 영역 -->
  <div id="map"></div>

  <!-- 우측 패널 -->
  <div id="side-panel">
    <h1>배송 경로 조회 (Direction5)</h1>

    <div class="section-title">기본 정보</div>

    <div class="field-group">
      <label for="vbeln">문서번호 (VBELN)</label>
      <input id="vbeln" type="text" readonly />
    </div>

    <div class="field-group">
      <label for="posnr">아이템번호 (POSNR)</label>
      <input id="posnr" type="text" readonly />
    </div>

    <div class="field-group">
      <label for="plantAddr">공장 주소</label>
      <input id="plantAddr" type="text" readonly />
    </div>

    <div class="field-group">
      <label for="shipAddr">고객 주소</label>
      <input id="shipAddr" type="text" readonly />
    </div>

    <div class="section-title">경로 요약</div>
    <div id="summary">아직 경로를 조회하지 않았습니다.</div>

    <div class="section-title">상태창</div>
    <textarea id="status-box" readonly></textarea>

    <div id="btn-container">
      <button id="btn-load">경로 조회</button>
      <button id="btn-reload">초기화 / 다시 그리기</button>
    </div>
  </div>

  <script>
    // ──────────────────────────────────────────────
    // 1. 기본 설정 (NodeJS Direction5 프록시 사용)
    // ──────────────────────────────────────────────
    // 예: Node 서버 index.js에서
    //     app.post("/direction5", ...) 로 구현한 경우
    const DIRECTION5_PROXY_URL = "https://capstone3-naver-api.onrender.com/direction5";

    let map;
    let routePolyline = null;
    let startMarker = null;
    let endMarker = null;

    const statusBox  = document.getElementById("status-box");
    const summaryBox = document.getElementById("summary");

    function logStatus(message) {
      const time = new Date().toLocaleTimeString("ko-KR", { hour12: false });
      statusBox.value += `[${time}] ${message}\n`;
      statusBox.scrollTop = statusBox.scrollHeight;
    }

    // URL 파라미터 읽기 (좌표 포함)
    function getQueryParams() {
      const params = new URLSearchParams(window.location.search);

      return {
        vbeln:     params.get("vbeln")     || "",
        posnr:     params.get("posnr")     || "",
        plantAddr: params.get("plantAddr") || params.get("plantaddr") || "",
        shipAddr:  params.get("shipAddr")  || params.get("shipaddr")  || "",
        startLat:  parseFloat(params.get("startLat")),
        startLng:  parseFloat(params.get("startLng")),
        destLat:   parseFloat(params.get("destLat")),
        destLng:   parseFloat(params.get("destLng"))
      };
    }

    function isValidCoord(lat, lng) {
      return (
        typeof lat === "number" &&
        typeof lng === "number" &&
        !Number.isNaN(lat) &&
        !Number.isNaN(lng) &&
        lat >= -90 && lat <= 90 &&
        lng >= -180 && lng <= 180
      );
    }

    // 폼에 URL 파라미터 채우기
    function fillHeaderFields() {
      const {
        vbeln,
        posnr,
        plantAddr,
        shipAddr,
        startLat,
        startLng,
        destLat,
        destLng
      } = getQueryParams();

      document.getElementById("vbeln").value     = vbeln;
      document.getElementById("posnr").value     = posnr;
      document.getElementById("plantAddr").value = decodeURIComponent(plantAddr);
      document.getElementById("shipAddr").value  = decodeURIComponent(shipAddr);

      logStatus(`초기 파라미터 – VBELN: ${vbeln}, POSNR: ${posnr}`);
      logStatus(`공장 주소: ${decodeURIComponent(plantAddr)}`);
      logStatus(`고객 주소: ${decodeURIComponent(shipAddr)}`);

      if (!isValidCoord(startLat, startLng) || !isValidCoord(destLat, destLng)) {
        logStatus("⚠ startLat/startLng 또는 destLat/destLng가 없거나 잘못됨.");
      } else {
        logStatus(
          `좌표 – start(${startLat}, ${startLng}), dest(${destLat}, ${destLng})`
        );
      }
    }

    // ──────────────────────────────────────────────
    // 2. 지도 초기화
    // ──────────────────────────────────────────────
    function initMap() {
      const { startLat, startLng, destLat, destLng } = getQueryParams();

      let center;
      if (isValidCoord(startLat, startLng) && isValidCoord(destLat, destLng)) {
        const midLat = (startLat + destLat) / 2;
        const midLng = (startLng + destLng) / 2;
        center = new naver.maps.LatLng(midLat, midLng);
      } else {
        center = new naver.maps.LatLng(37.5665, 126.9780); // 서울 시청
      }

      map = new naver.maps.Map("map", {
        center: center,
        zoom: 12
      });

      logStatus("네이버 지도 초기화 완료.");
    }

    // ──────────────────────────────────────────────
    // 3. NodeJS Direction5 프록시 호출
    //    (start/dest 좌표를 body로 넘김)
    // ──────────────────────────────────────────────
    async function callDirection5Proxy() {
      const {
        vbeln,
        posnr,
        startLat,
        startLng,
        destLat,
        destLng
      } = getQueryParams();

      if (!vbeln || !posnr) {
        logStatus("❌ VBELN / POSNR 파라미터가 비어 있음.");
        alert("VBELN / POSNR 이 URL 파라미터로 넘어와야 합니다.");
        return;
      }

      if (!isValidCoord(startLat, startLng) || !isValidCoord(destLat, destLng)) {
        logStatus("❌ 좌표 정보(startLat/startLng, destLat/destLng)가 유효하지 않음.");
        alert("출발/도착 좌표(startLat, startLng, destLat, destLng)가 필요합니다.");
        return;
      }

      logStatus(
        `Direction5 프록시 호출 준비 – start(${startLat},${startLng}) → dest(${destLat},${destLng})`
      );

      try {
        const response = await fetch(DIRECTION5_PROXY_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          // Node 서버에서 기대하는 body 예:
          // { start: { lat, lng }, goal: { lat, lng }, option: "trafast" }
          body: JSON.stringify({
            start: { lat: startLat, lng: startLng },
            goal:  { lat: destLat,  lng: destLng  },
            option: "trafast"
          })
        });

        if (!response.ok) {
          const txt = await response.text();
          logStatus(`❌ Direction5 프록시 HTTP ${response.status}: ${txt}`);
          alert("Direction5 프록시 호출 실패. 상태창을 확인하세요.");
          return;
        }

        const data = await response.json();
        logStatus("Direction5 프록시 응답 수신 완료.");

        // Naver Direction5 응답 형식:
        // data.route.trafast[0].path : [[x,y], [x,y], ...]
        if (!data.route || !data.route.trafast || !data.route.trafast[0]) {
          logStatus("❌ 응답에 route.trafast[0]가 없음.");
          alert("Direction5 응답 형식이 예상과 다릅니다.");
          return;
        }

        const routeObj = data.route.trafast[0];
        const path = routeObj.path || [];
        const summary = {
          distance: routeObj.summary?.distance,
          duration: routeObj.summary?.duration,
          startName: routeObj.summary?.start?.name,
          endName: routeObj.summary?.goal?.name
        };

        drawRouteOnMap(path);
        updateSummary(summary);
      } catch (err) {
        console.error(err);
        logStatus(`❌ Direction5 프록시 호출 오류: ${err.message}`);
        alert("Direction5 프록시 호출 중 오류가 발생했습니다.\n상태창을 확인하세요.");
      }
    }

    // ──────────────────────────────────────────────
    // 4. 지도에 경로 그리기
    //  - path: [[lon,lat], [lon,lat], ...]
    // ──────────────────────────────────────────────
    function drawRouteOnMap(path) {
      if (!Array.isArray(path) || path.length === 0) {
        logStatus("❌ path 데이터가 비어 있음.");
        return;
      }

      // 기존 경로 / 마커 삭제
      if (routePolyline) {
        routePolyline.setMap(null);
        routePolyline = null;
      }
      if (startMarker) {
        startMarker.setMap(null);
        startMarker = null;
      }
      if (endMarker) {
        endMarker.setMap(null);
        endMarker = null;
      }

      const latLngPath = path.map(function (p) {
        // p = [lon, lat]
        const lon = p[0];
        const lat = p[1];
        return new naver.maps.LatLng(lat, lon);
      });

      // Polyline
      routePolyline = new naver.maps.Polyline({
        map: map,
        path: latLngPath,
        strokeWeight: 5,
        strokeOpacity: 0.9
      });

      // 시작/끝 마커
      startMarker = new naver.maps.Marker({
        map: map,
        position: latLngPath[0],
        title: "출발지"
      });

      endMarker = new naver.maps.Marker({
        map: map,
        position: latLngPath[latLngPath.length - 1],
        title: "도착지"
      });

      // 전체 경로가 보이게 범위 조정
      const bounds = new naver.maps.LatLngBounds();
      latLngPath.forEach(function (latLng) {
        bounds.extend(latLng);
      });
      map.fitBounds(bounds);

      logStatus(`경로 그리기 완료. 좌표 개수: ${latLngPath.length}`);
    }

    // ──────────────────────────────────────────────
    // 5. 요약 영역 업데이트
    //  - summary: { distance, duration, startName, endName }
    // ──────────────────────────────────────────────
    function updateSummary(summary) {
      const distanceM = summary.distance || 0;
      const durationS = summary.duration || 0;

      const distanceKm = (distanceM / 1000).toFixed(2);
      const minutes = Math.floor(durationS / 60);
      const seconds = durationS % 60;

      const startName =
        summary.startName || document.getElementById("plantAddr").value || "(출발지)";
      const endName =
        summary.endName   || document.getElementById("shipAddr").value  || "(도착지)";

      const text =
        `출발지 : ${startName}\n` +
        `도착지 : ${endName}\n` +
        `거리   : ${distanceKm} km (${distanceM} m)\n` +
        `예상 소요 시간 : ${minutes}분 ${seconds}초`;

      summaryBox.textContent = text;
      logStatus("경로 요약정보 갱신 완료.");
    }

    // ──────────────────────────────────────────────
    // 6. 초기 로딩
    // ──────────────────────────────────────────────
    document.addEventListener("DOMContentLoaded", function () {
      fillHeaderFields();
      initMap();

      document.getElementById("btn-load").addEventListener("click", callDirection5Proxy);

      document.getElementById("btn-reload").addEventListener("click", function () {
        statusBox.value = "";
        summaryBox.textContent = "아직 경로를 조회하지 않았습니다.";

        if (routePolyline) {
          routePolyline.setMap(null);
          routePolyline = null;
        }
        if (startMarker) {
          startMarker.setMap(null);
          startMarker = null;
        }
        if (endMarker) {
          endMarker.setMap(null);
          endMarker = null;
        }

        logStatus("초기화 완료.");
      });

      // 필요하면 자동 조회
      // callDirection5Proxy();
    });
  </script>
</body>
</html>
